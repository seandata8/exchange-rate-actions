name: Download and graph CAD/USD rates
on:
  schedule:
    - cron: '8 23 * * *' # run at 7:08 pm Toronto time
    - cron: '28 21 * * *' # run at 5:28 pm Toronto time
  workflow_dispatch:

jobs:
  download_rates:
    name: Download rates from Bank of Canada Valet API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run download_rates.py
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Exchange rate data $(date +'%Y-%m-%d')" && git push)
